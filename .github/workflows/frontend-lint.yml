name: Frontend Lint

on: 
    pull_request:
        branches: [develop, main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            
            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm eslint . 